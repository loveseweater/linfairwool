<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Page Not Found | LINFAIR</title>
  <meta name="description" content="The page you are looking for does not exist. Explore LINFAIR's premium knitwear manufacturing services.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FAF5EF;
      color: #1B2A4A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 480px; }
    .code {
      font-size: 96px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #C19A6B;
      line-height: 1;
    }
    h1 { font-size: 24px; font-weight: 600; margin-top: 16px; }
    p { margin-top: 12px; color: #8B7355; line-height: 1.6; }
    .actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #C19A6B; color: #ffffff; }
    .btn-secondary { background: transparent; color: #1B2A4A; border: 1px solid #C19A6B; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for doesn't exist or may have been moved.<br>
    Explore our premium knitwear manufacturing services instead.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to Home</a>
      <a class="btn btn-secondary" href="/products">View Products</a>
      <a class="btn btn-secondary" href="/contact">Contact Us</a>
    </div>
  </div>
</body>
</html>
